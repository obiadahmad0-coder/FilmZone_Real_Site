<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FilmZone Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="admin"><h1>پنل مدیریت FilmZone</h1><div id="login"><input id="u" value="admin"><input id="p" type="password" placeholder="رمز مدیر"><button onclick="login()">ورود</button><p>رمز پیش‌فرض فقط برای اجرای محلی: ChangeMe123!</p></div><div id="panel" hidden><button onclick="logout()">خروج</button><h2>افزودن فیلم / سریال</h2><form id="form" enctype="multipart/form-data"><input name="title" placeholder="نام" required><input name="year" type="number" placeholder="سال"><select name="type"><option>فیلم</option><option>سریال</option></select><input name="genre" placeholder="ژانر"><input name="rating" type="number" step=".1" placeholder="امتیاز"><textarea name="description" placeholder="توضیحات"></textarea><label>پوستر <input name="poster" type="file" accept="image/*"></label><label>ویدیو <input name="video" type="file" accept="video/*"></label><input name="download" placeholder="لینک دانلود مستقیم (اختیاری)"><button>ذخیره</button></form><h2>عناوین</h2><div id="list"></div></div></main><script>
async function me(){let x=await (await fetch('/api/me')).json();loginBox(!x.user)}function loginBox(a){login.hidden=!a;panel.hidden=a;if(!a)load()}
async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)me();else alert((await r.json()).error)}
async function logout(){await fetch('/api/logout',{method:'POST'});me()}
form.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/titles',{method:'POST',body:new FormData(form)});if(r.ok){form.reset();load()}else alert((await r.json()).error)}
async function load(){let x=await (await fetch('/api/titles')).json();list.innerHTML=x.map(a=>`<div class="row"><b>${a.title}</b> — ${a.year} — ${a.type}<button onclick="del(${a.id})">حذف</button></div>`).join('')}
async function del(id){if(confirm('حذف شود؟')){await fetch('/api/titles/'+id,{method:'DELETE'});load()}}me();
</script></body></html>
